<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Titan Zero Diagnostics</title><link rel="stylesheet" href="diagnostics.css"><link rel="stylesheet" href="titan-theme.css"></head><body class="titan-diagnostics-page">
<header><div><strong>Titan Zero Diagnostics</strong><span>Runtime, bridge and error telemetry</span></div><div class="header-actions"><a href="modules.html">Modules</a><button id="titan-run-self-test">Run self-test</button><button id="titan-copy-all">Copy All</button><button id="titan-export-diagnostics">Export JSON</button><button id="titan-clear-log" class="danger">Clear Log</button></div></header>
<main>
<section class="summary" id="diag-summary"><div><span>Overall</span><strong id="overall-health">Checking…</strong></div><div><span>Errors</span><strong id="error-count">0</strong></div><div><span>Warnings</span><strong id="warning-count">0</strong></div><div><span>Events</span><strong id="event-count">0</strong></div></section>
<nav class="tabs"><button data-section="health" class="active">Health</button><button data-section="bridge">Bridge</button><button data-section="runtime">Runtime</button><button data-section="observability">Observability</button><button data-section="events">Events</button><button data-section="selftest">Self-test</button></nav>
<section id="section-health" class="panel active"><h2>Health</h2><div id="health-grid" class="grid"></div></section>
<section id="section-bridge" class="panel"><h2>Bridge</h2><div id="bridge-grid" class="grid"></div></section>
<section id="section-runtime" class="panel"><h2>Runtime</h2><div id="runtime-grid" class="grid"></div></section>
<section id="section-observability" class="panel"><h2>Observability</h2><div id="observability-grid" class="grid"></div><pre id="observability-events" class="event-log"></pre></section>
<section id="section-events" class="panel"><div class="row"><h2>Error & event log</h2><select id="log-filter"><option value="all">All</option><option value="error">Errors</option><option value="warn">Warnings</option><option value="info">Info</option></select></div><pre id="event-log"></pre></section>
<section id="section-selftest" class="panel"><h2>Self-test</h2><div id="selftest-results" class="grid"><div class="empty">Run self-test to exercise storage, permissions, active tab, background messaging and outcome bridge discovery.</div></div></section>
</main><script src="titan-theme.js"></script><script src="titan-reliability/diagnostic-retention.js"></script><script src="diagnostics.js"></script></body></html>
