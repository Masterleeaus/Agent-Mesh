<!DOCTYPE html>

    <script>
        // --- Conversion Utility To ToolOutput ---
        function toToolOutput(data) {
            if (data === null || data === undefined) {
                return [];
            }
            if (Array.isArray(data)) {
                return data.filter(item => item !== undefined && item !== null);
            }
            if (typeof data === 'object' || typeof data === 'string') {
                return [data];
            }
            return [String(data)];
        }

        // --- Code-plan `vars` persistence ---
        // Serializes the sandbox `vars` global for the results postMessage. Per-key
        // JSON round-trip: guarantees the snapshot is structured-clonable (a function
        // or DOM node would otherwise throw DataCloneError and lose the ENTIRE
        // results message, hanging the execution until timeout).
        const VARS_PER_VAR_MAX_CHARS = 1_000_000; // ~1MB per variable
        const VARS_TOTAL_MAX_CHARS = 4_000_000;   // ~4MB across all variables
        function __rtrvrSerializeVars(varsObj, warn) {
            const out = {};
            if (!varsObj || typeof varsObj !== 'object') return out;
            let total = 0;
            for (const key of Object.keys(varsObj)) {
                let json;
                try {
                    json = JSON.stringify(varsObj[key]);
                } catch (e) {
                    warn(`vars.${key} was NOT saved: not JSON-serializable (${e && e.message})`);
                    continue;
                }
                if (json === undefined) {
                    warn(`vars.${key} was NOT saved: functions/undefined cannot persist`);
                    continue;
                }
                if (json.length > VARS_PER_VAR_MAX_CHARS) {
                    warn(`vars.${key} was NOT saved: ${json.length} chars exceeds the per-variable cap`);
                    continue;
                }
                if (total + json.length > VARS_TOTAL_MAX_CHARS) {
                    warn(`vars.${key} was NOT saved: total saved-vars budget exceeded`);
                    continue;
                }
                total += json.length;
                out[key] = JSON.parse(json);
            }
            return out;
        }

        // Override fetch to proxy through the main extension
        const originalFetch = window.fetch;
        window.__rtrvrCurrentExecutionContext = null;
        window.__rtrvrAvailableTools = [];
        // Line offset of the currently eval'd user code: 0 for direct eval,
        // 1 when evaluateSandboxCode rewraps it in an async IIFE.
        window.__rtrvrEvalLineOffset = 0;

        // Best-effort source line of the rtrvr.* call site inside the eval'd
        // script (V8 reports eval frames as "<anonymous>:LINE:COL"; the first
        // such frame is the innermost user-code frame — wrapper frames carry
        // this page's filename). Powers the live execution pointer in the UI.
        function __rtrvrCaptureCallLine() {
            try {
                const stack = String(new Error().stack || '');
                const match = stack.match(/<anonymous>:(\d+):(\d+)/);
                if (!match) return undefined;
                const line = Number(match[1]) - (window.__rtrvrEvalLineOffset || 0);
                return Number.isFinite(line) && line > 0 ? line : undefined;
            } catch (_) {
                return undefined;
            }
        }

        function __rtrvrContextWithCallLine() {
            const base = window.__rtrvrCurrentExecutionContext;
            const callLineNumber = __rtrvrCaptureCallLine();
            if (!base && callLineNumber === undefined) return undefined;
            return { ...(base || {}), callLineNumber };
        }

        // rtrvr.* namespace — same shape as webpage page-tool runtime so
        // generated code can be portable between sandbox and webpage modes.
        window.rtrvr = window.rtrvr || {};

        window.rtrvr.listTools = (names) => {
            try {
                const all = JSON.parse(JSON.stringify(window.__rtrvrAvailableTools || []));
                // Optional names filter: the planner prompt lists most tools by
                // name only and fetches their schemas here on demand. Dot-suffix
                // matches tolerate a bare tool name for namespaced entries.
                if (!Array.isArray(names) || names.length === 0) return all;
                const wanted = names.map(String);
                return all.filter((tool) => wanted.some((n) => tool.name === n || tool.name.endsWith('.' + n)));
            } catch (_) {
                return [];
            }
        };

        // The tabs the user selected for this run, as { tabId, title, url, active, isSource }
        // (SOURCE first). A trusted function the model can call to get a REAL tab id at
        // runtime — so it never has to reference the injected `selectedTabs`/`tabIds`
        // globals it distrusts, nor transcribe a numeric id. Local accessor (no RPC),
        // mirroring rtrvr.listTools above; reads the window.selectedTabs the execute
        // handler injects from executionContext.selectedTabs.
        // async so it returns a Promise: the model treats every documented
        // `await rtrvr.*()` helper as thenable and writes `.then(...)` on it — a sync
        // array return would throw "selectedTabs(...).then is not a function".
        window.rtrvr.selectedTabs = async () => {
            try {
                return JSON.parse(JSON.stringify(window.selectedTabs || []));
            } catch (_) {
                return [];
            }
        };

        // Set when the parent posts 'cancelExecution' for the current run (the
        // user hit Stop). Cooperative helpers (rtrvr.mapLimit) read it to stop
        // scheduling new work; scripts can poll it via rtrvr.isCancelled().
        window.__rtrvrCancelled = false;
        window.__rtrvrCurrentExecutionId = null;
        window.addEventListener('message', (event) => {
            if (event.source !== window.parent || event.data?.type !== 'cancelExecution') return;
            const ids = event.data.executionIds;
            if (!Array.isArray(ids) || ids.includes(window.__rtrvrCurrentExecutionId)) {
                window.__rtrvrCancelled = true;
            }
        });

        // async so it's thenable like every other documented rtrvr.* helper
        // (mirrors rtrvr.selectedTabs above).
        window.rtrvr.isCancelled = async () => window.__rtrvrCancelled === true;

        // Terminal signal: returns the completion marker the plan script
        // `return`s to end the task (verify-then-finish). Native version of
        // the backend's compat shim — the shim's `if (!rtrvr.done)` guard
        // defers to this implementation. Synchronous by design so it can be
        // returned directly: `return rtrvr.done({ summary })`.
        window.rtrvr.done = (o) => ({ __rtrvrDone: true, ...(o || {}) });

        window.rtrvr.invokeBuiltin = (helperName, args = {}) => {
            return new Promise((resolve, reject) => {
                if (typeof helperName !== 'string' || !helperName) {
                    reject(new Error('rtrvr.invokeBuiltin requires a helper name'));
                    return;
                }
                if (!window.parent || window.parent === window) {
                    reject(new Error('Cannot call builtin helper: no parent window access'));
                    return;
                }
                const rpcId = crypto.randomUUID();
                const listener = (event) => {
                    if (event.source !== window.parent) return;
                    if (event.data?.type !== 'builtinHelperResult' || event.data?.rpcId !== rpcId) return;
                    window.removeEventListener('message', listener);
                    if (event.data.error) {
                        const err = new Error(event.data.error.message || `rtrvr.${helperName} failed`);
                        if (event.data.error.name) err.name = event.data.error.name;
                        if (event.data.error.details && typeof event.data.error.details === 'object') err.details = event.data.error.details;
                        reject(err);
                    } else {
                        resolve(event.data.result);
                    }
                };
                window.addEventListener('message', listener);
                try {
                    window.parent.postMessage({
                        type: 'builtinHelper',
                        rpcId,
                        helper: helperName,
                        args: args || {},
                        executionContext: __rtrvrContextWithCallLine(),
                    }, '*');
                } catch (e) {
                    window.removeEventListener('message', listener);
                    reject(e);
                }
            });
        };

        const __rtrvrPlannerToolAliases = {
            act_on_tab: 'act',
            extract_from_tab: 'extract',
            crawl_and_extract_from_tab: 'crawl',
            sheets_workflow: 'sheetsWorkflow',
            infer_sheet_data: 'inferSheetData',
            create_sheet_from_data: 'createSheetFromData',
            query_rtrvr_ai_documentation: 'queryRtrvrDocs',
            google_doc_generator: 'googleDocGenerator',
            google_slides_generator: 'googleSlidesGenerator',
            webpage_generator: 'webpageGenerator',
            pdf_generator: 'pdfGenerator',
            pdf_filler: 'pdfFiller',
            custom_tool_generator: 'customToolGenerator',
            process_text: 'processText',
            capture_screenshot: 'captureScreenshot',
        };

        window.rtrvr.mapLimit = async (items, concurrency, fn) => {
            if (typeof concurrency === 'function') {
                fn = concurrency;
                // No explicit concurrency: fall back to the user's Max Parallel Tabs
                // budget (injected as window.maxParallelTabs) instead of a fixed 3.
                concurrency = Number(window.maxParallelTabs) || 3;
            }
            if (!Array.isArray(items)) throw new Error('rtrvr.mapLimit requires an array');
            if (typeof fn !== 'function') throw new Error('rtrvr.mapLimit requires an async callback');
            const limit = Math.max(1, Math.min(items.length || 1, Math.floor(Number(concurrency) || 1)));
            const results = new Array(items.length);
            let cursor = 0;
            // Cancel observed: stop scheduling new items but keep completed slots.
            let stopped = false;
            await Promise.all(Array.from({ length: limit }, async () => {
                while (cursor < items.length && !stopped && window.__rtrvrCancelled !== true) {
                    const index = cursor++;
                    try {
                        results[index] = await fn(items[index], index);
                    } catch (error) {
                        // Cancel is a stop signal, not a failure: resolve with PARTIAL
                        // results (unprocessed slots stay undefined) so the script's
                        // trailing flush (e.g. appendRow) still runs. The error-name
                        // match covers a missed cancelExecution message — any gated
                        // rtrvr.* call rejects with this name on cancel (see
                        // RTRVR_CANCELLED_ERROR_NAME in @rtrvr-ai/shared constants).
                        if (window.__rtrvrCancelled === true || (error && error.name === 'RtrvrCancelledError')) {
                            stopped = true;
                            return;
                        }
                        // Ordinary failures keep the old semantics: unwind mapLimit.
                        throw error;
                    }
                }
            }));
            return results;
        };

        window.rtrvr.executeMultipleTools = async ({ toolCalls, tool_calls, concurrency = 1 } = {}) => {
            const calls = Array.isArray(toolCalls) ? toolCalls : tool_calls;
            if (!Array.isArray(calls) || calls.length === 0) {
                throw new Error('rtrvr.executeMultipleTools requires { toolCalls }');
            }
            const normalized = calls.map((call, index) => {
                if (!call || typeof call !== 'object') {
                    throw new Error(`rtrvr.executeMultipleTools toolCalls[${index}] must be an object`);
                }
                if (call.name !== undefined && call.name !== null && String(call.name).trim() !== '') {
                    throw new Error(`rtrvr.executeMultipleTools toolCalls[${index}] uses ambiguous "name"; use helper for rtrvr helpers or toolName for custom tools`);
                }
                const explicitHelper = String(call.helper || '').trim();
                const explicitTool = String(call.toolName || call.tool_name || '').trim();
                if (explicitHelper && explicitTool) {
                    throw new Error(`rtrvr.executeMultipleTools toolCalls[${index}] must use either helper or toolName, not both`);
                }
                const rawName = String(explicitHelper || explicitTool || '').trim();
                if (!rawName) throw new Error(`rtrvr.executeMultipleTools toolCalls[${index}] is missing helper/toolName`);
                const stripped = rawName.startsWith('rtrvr.') ? rawName.slice('rtrvr.'.length) : rawName;
                const alias = __rtrvrPlannerToolAliases[stripped];
                const helper = alias || stripped;
                const args = call.args || call.parameters || call.toolArgs || call.tool_args || {};
                const rendered = JSON.stringify({ helper, args });
                if (/\{\{|\bhistory\.step\b|\bstep\./.test(rendered || '')) {
                    throw new Error(`rtrvr.executeMultipleTools toolCalls[${index}] contains planner placeholders; use JavaScript sequencing instead`);
                }
                return { helper, toolName: alias ? undefined : stripped, args, mode: explicitHelper || alias ? 'helper' : 'tool' };
            });
            for (const call of normalized) {
                if (call.mode === 'helper' && (typeof window.rtrvr[call.helper] !== 'function' || call.helper === 'executeMultipleTools')) {
                    throw new Error(`Unknown rtrvr helper '${call.helper}'`);
                }
            }
            const results = await window.rtrvr.mapLimit(normalized, concurrency, async ({ helper, toolName, args, mode }, index) => {
                const fn = window.rtrvr[helper];
                try {
                    if (mode === 'helper') {
                        if (typeof fn !== 'function' || helper === 'executeMultipleTools') {
                            throw new Error(`Unknown rtrvr helper '${helper}'`);
                        }
                        return { index, helper, ok: true, result: await fn(args || {}) };
                    }
                    if (typeof window.rtrvr.callTool === 'function') {
                        return { index, helper: toolName || helper, ok: true, result: await window.rtrvr.callTool(toolName || helper, args || {}) };
                    }
                    throw new Error(`Unknown helper or tool '${helper}'`);
                } catch (error) {
                    return { index, helper, ok: false, error: error?.message || String(error) };
                }
            });
            const openedTabs = results.flatMap(r => Array.isArray(r.result?.openedTabs) ? r.result.openedTabs : []);
            const closedTabIds = results.flatMap(r => Array.isArray(r.result?.closedTabIds) ? r.result.closedTabIds : []);
            const failed = results.filter(r => !r.ok).length;
            return {
                results,
                count: results.length,
                succeeded: results.length - failed,
                failed,
                openedTabs: openedTabs.length ? openedTabs : undefined,
                closedTabIds: closedTabIds.length ? closedTabIds : undefined,
            };
        };

        window.rtrvr.createSheet = (args = {}) => window.rtrvr.invokeBuiltin('createSheet', args);
        window.rtrvr.appendRow = (args = {}) => window.rtrvr.invokeBuiltin('appendRow', args);
        window.rtrvr.appendColumn = (args = {}) => window.rtrvr.invokeBuiltin('appendColumn', args);
        window.rtrvr.readSheet = (args = {}) => window.rtrvr.invokeBuiltin('readSheet', args);
        window.rtrvr.updateRange = (args = {}) => window.rtrvr.invokeBuiltin('updateRange', args);
        window.rtrvr.getPageTree = (args = {}) => window.rtrvr.invokeBuiltin('getPageTree', args);
        window.rtrvr.pageAction = (args = {}) => window.rtrvr.invokeBuiltin('pageAction', args);
        window.rtrvr.listTabs = (args = {}) => window.rtrvr.invokeBuiltin('listTabs', args);

        window.rtrvr.readSkill = (args = {}) => window.rtrvr.invokeBuiltin('readSkill', args);

        window.rtrvr.listSkills = (args = {}) => window.rtrvr.invokeBuiltin('listSkills', args);

        window.rtrvr.listRecordings = (args = {}) => window.rtrvr.invokeBuiltin('listRecordings', args);

        window.rtrvr.crawl = (args = {}) => window.rtrvr.invokeBuiltin('crawl', args);
        window.rtrvr.sheetsWorkflow = (args = {}) => window.rtrvr.invokeBuiltin('sheetsWorkflow', args);
        window.rtrvr.inferSheetData = (args = {}) => window.rtrvr.invokeBuiltin('inferSheetData', args);

        window.rtrvr.setLlmConfig = (args = {}) => window.rtrvr.invokeBuiltin('setLlmConfig', args);
        window.rtrvr.getUserSettings = (args = {}) => window.rtrvr.invokeBuiltin('getUserSettings', args);

        window.rtrvr.checkTriggerResults = (args = {}) => window.rtrvr.invokeBuiltin('checkTriggerResults', args);
        // Bright Data dataset ids as constants so generated code never retypes
        // raw gd_ ids. This file cannot import, so it is the ONE hand-kept mirror
        // of ENRICH_DATASETS (shared/lib/types/agent-types.ts); enrich-datasets.test.ts
        // parses this literal and fails if the two ever drift.
        window.rtrvr.datasets = {
            linkedinPeople: 'gd_l1viktl72bvl7bjuj0',
            linkedinPeopleContact: 'gd_me5ppxjr2ge6icjuh0',
            linkedinCompanies: 'gd_l1vikfnt1wgvvqz95w',
            crunchbaseCompanies: 'gd_l1vijqt9jfj7olije',

        };
        window.rtrvr.askUser = (args = {}) => window.rtrvr.invokeBuiltin('askUser', args);
        window.rtrvr.withNewTab = async (options = {}, fn) => {
            if (!options || typeof options.url !== 'string' || !options.url.trim()) {
                throw new Error('rtrvr.withNewTab requires { url }');
            }
            if (typeof fn !== 'function') {
                throw new Error('rtrvr.withNewTab requires an async callback');
            }
            const opened = await window.rtrvr.pageAction({
                tool: 'open_new_tab',
                args: { url: options.url },
                tabId: options.tabId,
            });
            const tabId = opened?.newTabId || opened?.openedTabs?.[0]?.tabId;
            if (!tabId) throw new Error('rtrvr.withNewTab failed to open a tab');
            try {
                return await fn({ tabId, opened });
            } finally {
                if (options.close !== false) {
                    try {
                        await window.rtrvr.pageAction({
                            tool: 'close_tab',
                            args: { tab_id: tabId },
                            tabId: options.tabId,
                        });
                    } catch (error) {
                        console.warn('rtrvr.withNewTab failed to close tab', error);
                    }
                }
            }
        };

        // --- Semantic page interaction (find/click/type/waitFor/waitForUrl) ---
        // Proxied to the target tab's page-tool runtime via the parent's
        // pageToolRpc channel. Targets the execution's sourceTabId by default;
        // pass { tabId } in the options to address another tab.
        const __rtrvrSleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        const __rtrvrSerializeMatcher = (matcher) => {
            if (matcher instanceof RegExp) {
                return { __rtrvrRegex: true, source: matcher.source, flags: matcher.flags };
            }
            return matcher;
        };
        const __rtrvrSerializeTarget = (target) => {
            if (!target || typeof target !== 'object') return target;
            if (target.__rtrvrPageHandle === true) return target;
            return {
                selector: target.selector,
                text: __rtrvrSerializeMatcher(target.text),
                role: target.role,
                name: __rtrvrSerializeMatcher(target.name),
                placeholder: __rtrvrSerializeMatcher(target.placeholder),
                within:
                    typeof target.within === 'string'
                        ? target.within
                        : target.within && typeof target.within === 'object'
                            ? __rtrvrSerializeTarget(target.within)
                            : undefined,
                focused: target.focused === true ? true : undefined,
            };
        };
        const __rtrvrPageToolRpc = (command, tabId) => new Promise((resolve, reject) => {
            if (!window.parent || window.parent === window) {
                reject(new Error('Cannot proxy page tool command: no parent window access.'));
                return;
            }
            const rpcId = crypto.randomUUID();
            const timeoutId = window.setTimeout(() => {
                window.removeEventListener('message', onMessage);
                reject(new Error('Page tool RPC timed out for ' + command.kind));
            }, 30000);
            const onMessage = (event) => {
                if (event.source !== window.parent || event.data?.type !== 'pageToolRpcResponse' || event.data?.rpcId !== rpcId) {
                    return;
                }
                window.clearTimeout(timeoutId);
                window.removeEventListener('message', onMessage);
                if (event.data.error) {
                    const error = new Error(event.data.error.message || 'Page tool RPC failed');
                    if (event.data.error.name) error.name = event.data.error.name;
                    if (event.data.error.stack) error.stack = event.data.error.stack;
                    if (event.data.error.details && typeof event.data.error.details === 'object') error.details = event.data.error.details;
                    reject(error);
                    return;
                }
                resolve(event.data.payload);
            };
            window.addEventListener('message', onMessage);
            const baseContext = window.__rtrvrCurrentExecutionContext || {};
            const effectiveTabId = Number.isFinite(Number(tabId)) ? Number(tabId) : baseContext.sourceTabId;
            window.parent.postMessage({
                type: 'pageToolRpc',
                rpcId,
                command,
                executionContext: {
                    ...baseContext,
                    sourceTabId: effectiveTabId,
                    callLineNumber: __rtrvrCaptureCallLine(),
                },
            }, '*');
        });
        window.rtrvr.find = async (target, options = {}) => {
            return await __rtrvrPageToolRpc({ kind: 'find', target: __rtrvrSerializeTarget(target) }, options.tabId);
        };
        window.rtrvr.elementId = async (target, options = {}) => {
            return await __rtrvrPageToolRpc({ kind: 'elementId', target: __rtrvrSerializeTarget(target) }, options.tabId);
        };
        window.rtrvr.click = async (target, options = {}) => {
            return await __rtrvrPageToolRpc({ kind: 'click', target: __rtrvrSerializeTarget(target) }, options.tabId);
        };
        window.rtrvr.type = async (target, value, options = {}) => {
            return await __rtrvrPageToolRpc({
                kind: 'type',
                target: __rtrvrSerializeTarget(target),
                value: String(value ?? ''),

            const startedAt = Date.now();
            while (Date.now() - startedAt <= timeoutMs) {
                if (typeof targetOrFn === 'function') {
                    const result = await Promise.resolve(targetOrFn());
                    if (result) return result;
                } else {
                    const handle = await window.rtrvr.find(targetOrFn, { tabId: options.tabId });
                    if (handle) return handle;
                }
                await __rtrvrSleep(intervalMs);
            }
            let missSummary;
            if (typeof targetOrFn !== 'function') {
                try {
                    missSummary = await __rtrvrPageToolRpc(

        function parsesAsAsyncFunctionBody(code) {

            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;

        window.rtrvr.callTool = (toolName, parameters = {}) => {

                    return;

                    reject(new Error('Cannot call tool: no parent window access'));
                    return;

                    if (event.source !== window.parent) return;
                    if (event.data?.type !== 'callToolResult' || event.data?.rpcId !== rpcId) return;
                    window.removeEventListener('message', listener);

                        const err = new Error(event.data.error.message || 'callTool failed');
                        if (event.data.error.name) err.name = event.data.error.name;

                    window.parent.postMessage({
                        type: 'callTool',
                        rpcId,
                        toolName,

                        // rtrvr.invokeBuiltin and the page-tool RPC below.
                        executionContext: __rtrvrContextWithCallLine(),

        // --- Base URL for DOMParser documents built from fetched HTML ---
        // This sandbox page lives at chrome-extension://<id>/sandbox/index.html and a
        // DOMParser document inherits that as its base URL, so a relative href in fetched
        // HTML ("/news/articles/...") resolved through `a.href` to a chrome-extension://
        // URL that leaked straight into sheets. Remember which URL each proxied fetch body
        // came from — keyed by the body string itself (Map compares strings by value, so
        // the `.text()` result the plan script holds finds it) — and stamp a <base href>

                __rtrvrFetchedBodyUrls.delete(body); // re-insert so it becomes most-recent
                __rtrvrFetchedBodyUrlChars -= body.length;

            __rtrvrFetchedBodyUrls.set(body, url);
            __rtrvrFetchedBodyUrlChars += body.length;
            while (
                __rtrvrFetchedBodyUrls.size > 1 &&
                (__rtrvrFetchedBodyUrls.size > FETCHED_BODY_URL_MAX_ENTRIES ||
                    __rtrvrFetchedBodyUrlChars > FETCHED_BODY_URL_MAX_CHARS)

                        'headers',
                        'body',
                        'credentials',
                        'mode',
                        'redirect',
                        'referrer',
                        'referrerPolicy',
                        'cache',
                        'integrity',
                        'keepalive',

                            nextInit.headers = toPlainHeaders(nextInit.headers);

                    let nextInit = toSerializableInit(init);

                            url: input.url,
                            method: input.method,
                            headers: toPlainHeaders(input.headers),
                            credentials: input.credentials,
                            mode: input.mode,
                            redirect: input.redirect,
                            referrer: input.referrer,
                            referrerPolicy: input.referrerPolicy,
                            cache: input.cache,
                            integrity: input.integrity,

                        window.__rtrvrCancelled = previousCancelled;
                        window.__rtrvrCurrentExecutionId = previousExecutionId;

                            console[method] = originalConsole[method];
                        });

                        const toolOutputResult = toToolOutput(finalResult);
                        results.push({
                            functionCallArgs: functionCallArgs,
                            result: toolOutputResult,
                            consoleOutput: consoleOutput,
                            error: error,
                            vars: Object.keys(capturedVars).length > 0 ? capturedVars : undefined,

                    }
                }
                // Post all results (MCP + Sandboxed) back
                if (event.source && event.source.postMessage) {
                    event.source.postMessage({
                        type: 'results',
                        executionId: executionId, // Include execution ID
                        results: results,
                    }, '*');
                }
            }
        });
