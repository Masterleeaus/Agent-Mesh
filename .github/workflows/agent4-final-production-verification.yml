name: Agent 4 Final Production Verification

on:
  pull_request:
    paths:
      - "packages/storage/test/final-cleaning-convergence.test.ts"
      - "packages/storage/**"
      - "services/workforce/**"
      - "packages/runtime/agent-runtime/**"
      - "packages/tools/execution-gateway.mjs"
      - "packages/titan-platform/src/ported/titan-runtime/interaction-engine/**"
      - "packages/titan-platform/tests/zero-governance-convergence.test.mjs"
      - ".github/workflows/agent4-final-production-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleaning-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies for focused verification
        run: pnpm install --no-frozen-lockfile

      - name: Final cleaning convergence acceptance
        run: pnpm --filter @titan-zero/storage exec vitest run test/final-cleaning-convergence.test.ts

      - name: Workforce behavioural tests
        run: pnpm --filter @titan-zero/workforce test

      - name: Persistent agent runtime tests
        run: node --test packages/runtime/agent-runtime/tests/agent-runtime.test.mjs packages/runtime/agent-runtime/sqlite-run-store.test.mjs

      - name: Governed execution gateway tests
        run: node --test packages/tools/execution-gateway.test.mjs

  zero-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies for Zero verification
        run: pnpm install --no-frozen-lockfile

      - name: Compile Zero governance seams
        run: pnpm --filter @titan-zero/titan-platform exec tsc -p tsconfig.json --noEmit false --outDir .zero-test-dist --module NodeNext --moduleResolution NodeNext --isolatedModules false

      - name: Zero governance convergence tests
        run: node --test packages/titan-platform/tests/zero-governance-convergence.test.mjs
