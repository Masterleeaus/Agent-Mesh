name: Retire Superseded Titan Estimate Routes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-superseded-titan-estimate-routes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          # convert: canonical reconciles all credited deposit/progress invoices.
          # create-job: canonical requires explicit link_existing_job_id rather than
          # silently linking an open client job, preserving operator intent.
          git rm -f             'titan/apps/web/app/api/v1/estimates/[id]/convert/route.ts'             'titan/apps/web/app/api/v1/estimates/[id]/create-job/route.ts'
          find titan/apps -depth -type d -empty -delete || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Retire superseded Titan estimate routes"
          git push
