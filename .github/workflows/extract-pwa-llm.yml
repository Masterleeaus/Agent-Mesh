name: Extract PWA and LLM Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-pwa-llm.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PWA safely
        shell: bash
        run: |
          set -euo pipefail
          ZIP='apps/pwa/Titan-Zero-PWA-Apps-current(2).zip'
          test -f "$ZIP"
          rm -rf /tmp/pwa-extracted /tmp/pwa-stage
          mkdir -p /tmp/pwa-extracted /tmp/pwa-stage
          unzip -t "$ZIP"
          unzip -q "$ZIP" -d /tmp/pwa-extracted
          ROOT=/tmp/pwa-extracted
          COUNT=$(find "$ROOT" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          if [ "$COUNT" = "1" ]; then
            ONLY=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
            if [ -n "$ONLY" ]; then ROOT="$ONLY"; fi
          fi
          cp -a "$ROOT"/. /tmp/pwa-stage/
          test "$(find /tmp/pwa-stage -type f | wc -l)" -gt 1
          find apps/pwa -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a /tmp/pwa-stage/. apps/pwa/
          rm -f apps/pwa/*.zip

      - name: Extract LLM plugin safely
        shell: bash
        run: |
          set -euo pipefail
          ZIP='apps/llm-plugin/Titan-Zero-LLM-Plugin-current.zip'
          test -f "$ZIP"
          rm -rf /tmp/llm-extracted /tmp/llm-stage
          mkdir -p /tmp/llm-extracted /tmp/llm-stage
          unzip -t "$ZIP"
          unzip -q "$ZIP" -d /tmp/llm-extracted
          ROOT=/tmp/llm-extracted
          COUNT=$(find "$ROOT" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          if [ "$COUNT" = "1" ]; then
            ONLY=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
            if [ -n "$ONLY" ]; then ROOT="$ONLY"; fi
          fi
          cp -a "$ROOT"/. /tmp/llm-stage/
          test "$(find /tmp/llm-stage -type f | wc -l)" -gt 1
          find apps/llm-plugin -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a /tmp/llm-stage/. apps/llm-plugin/
          rm -f apps/llm-plugin/*.zip

      - name: Verify extracted trees
        run: |
          set -euo pipefail
          echo "PWA files: $(find apps/pwa -type f | wc -l)"
          echo "LLM files: $(find apps/llm-plugin -type f | wc -l)"
          ! find apps/pwa apps/llm-plugin -maxdepth 1 -type f -name '*.zip' | grep -q .

      - name: Commit extracted apps
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/pwa apps/llm-plugin
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract PWA and LLM plugin sources"
          git push
