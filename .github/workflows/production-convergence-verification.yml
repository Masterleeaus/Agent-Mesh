name: Production Convergence Verification

on:
  pull_request:
    paths:
      - "tests/zero-*.test.*"
      - "db/sqlite/**"
      - "apps/web/lib/zero/**"
      - "apps/web/lib/work-orders/**"
      - "apps/web/app/api/v1/zero/**"
      - "packages/storage/**"
      - "packages/deployment/**"
      - "scripts/verify-release-candidate.mjs"
      - "scripts/inventory-release-artifacts.mjs"
      - "services/workforce/**"
      - "packages/runtime/agent-runtime/**"
      - "packages/tools/execution-gateway.mjs"
      - "packages/tools/governed-execution-recovery.mjs"
      - "packages/tools/*recovery*.test.mjs"
      - "tests/fixtures/native-*.ts"
      - "tests/hosted-workforce-runtime.test.ts"
      - ".github/workflows/production-convergence-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signed release candidate and lifecycle verification
        run: node --test packages/deployment/*.test.mjs

  cleaning-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The repository root lockfile is currently stale relative to package.json
      # (better-sqlite3 was added without a lockfile refresh). That is tracked as
      # a production-readiness finding; this focused verifier must still reach the
      # acceptance tests so we can diagnose the canonical runtime itself.
      - name: Install dependencies for focused verification
        run: pnpm install --no-frozen-lockfile

      - name: SQLite Zero job acceptance
        run: |
          node --test tests/zero-verified-job-schema.test.mjs
          pnpm --filter @titan-zero/workforce exec tsx --tsconfig ../../apps/web/tsconfig.json --test ../../tests/zero-verified-job.test.ts ../../tests/zero-work-order-owner.test.ts ../../tests/zero-storage-concurrency.test.ts ../../tests/zero-execution-recovery.test.ts ../../tests/hosted-workforce-runtime.test.ts

      - name: Workforce behavioural tests
        run: pnpm --filter @titan-zero/workforce test

      - name: Persistent agent runtime tests
        run: node --test packages/runtime/agent-runtime/tests/agent-runtime.test.mjs packages/runtime/agent-runtime/sqlite-run-store.test.mjs

      - name: Governed execution gateway tests
        run: node --test packages/tools/execution-gateway.test.mjs packages/tools/governed-execution-recovery.test.mjs packages/tools/execution-recovery-durable.test.mjs packages/tools/accepted-evidence-ledger.test.mjs
