name: Extract archive ZIPs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-archive-zips.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract every ZIP under archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for zip in archive/*.zip archive/**/*.zip; do
            found=1
            base="$(basename "$zip" .zip)"
            dest="$(dirname "$zip")/$base"
            echo "Extracting $zip -> $dest"
            rm -rf "$dest"
            mkdir -p "$dest"
            unzip -q -o "$zip" -d "$dest"
          done
          if [ "$found" -eq 0 ]; then
            echo "No ZIP files found under archive/"
          fi
      - name: Commit extracted archive contents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "archive: extract all ZIP packages"
          git push
