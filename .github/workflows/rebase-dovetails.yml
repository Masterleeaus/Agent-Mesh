name: Rebase repository on Dovetails

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebase-dovetails.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move existing Titan system and extract Dovetails
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          mkdir -p titan

          # Move all tracked root entries except GitHub control files,
          # the archive itself, and the destination folder.
          while IFS= read -r -d '' item; do
            base="${item#./}"
            case "$base" in
              .git|.github|titan|AI-FSM-Dovetails.zip) continue ;;
            esac
            if git ls-files --error-unmatch -- "$base" >/dev/null 2>&1 || git ls-files -- "$base/" | grep -q .; then
              git mv "$base" titan/
            fi
          done < <(find . -mindepth 1 -maxdepth 1 -print0)

          tmp="$(mktemp -d)"
          unzip -q AI-FSM-Dovetails.zip -d "$tmp"

          entries=("$tmp"/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          else
            src="$tmp"
          fi

          # Keep repo automation under .github; Dovetails becomes the application root.
          rm -rf "$src/.github"
          cp -a "$src"/. ./
          rm -rf "$tmp"

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make Dovetails the base app; archive previous Titan system under titan/" || exit 0
          git push
