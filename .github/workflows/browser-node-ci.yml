name: Titan Zero Browser Node CI
# Browser Node product gate (verified runner/sidebar/diagnostics)

on:
  push:
    paths:
      - 'apps/browser/**'
      - '.github/workflows/browser-node-ci.yml'
  pull_request:
    paths:
      - 'apps/browser/**'
      - '.github/workflows/browser-node-ci.yml'

permissions:
  contents: read

jobs:
  verify-browser-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies without mutating package source
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Verify Browser Node source manifest is current
        run: |
          npm run source-manifest
          git diff --exit-code -- source-manifest.json

      - name: Interaction Engine typecheck
        run: npm run interaction:typecheck

      - name: Browser Node verifier
        run: npm test
