name: Titan Zero Browser Node CI

on:
  push:
    paths:
      - 'apps/browser/**'
      - '.github/workflows/browser-node-ci.yml'
  pull_request:
    paths:
      - 'apps/browser/**'
      - '.github/workflows/browser-node-ci.yml'

permissions:
  contents: write

jobs:
  verify-browser-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Browser Node development-pack prune
        if: github.event_name == 'push' && github.ref_name == 'browser-node-devpack-prune'
        run: |
          if [ -f tools/prune-browser-node-devpacks.mjs ]; then
            node tools/prune-browser-node-devpacks.mjs
            cd ../..
            if ! git diff --quiet -- apps/browser/src/lib/service-worker.js; then
              git config user.name "Titan Zero CI"
              git config user.email "actions@users.noreply.github.com"
              git add apps/browser/src/lib/service-worker.js
              git commit -m "refactor(browser): remove development packs from startup"
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Regenerate Browser Node source manifest
        if: github.event_name == 'push'
        run: |
          npm run source-manifest
          cd ../..
          if ! git diff --quiet -- apps/browser/source-manifest.json; then
            git config user.name "Titan Zero CI"
            git config user.email "actions@users.noreply.github.com"
            git add apps/browser/source-manifest.json
            git commit -m "chore(browser): refresh Browser Node source manifest"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Verify Browser Node source manifest is current
        if: github.event_name == 'pull_request'
        run: |
          npm run source-manifest
          git diff --exit-code -- source-manifest.json

      - name: Interaction Engine typecheck
        run: npm run interaction:typecheck

      - name: Browser Node verifier
        run: npm test
