name: Titan Zero Browser Node CI

on:
  push:
    branches:
      - browser-node-convergence-v2
    paths:
      - 'apps/browser/**'
      - '.github/workflows/browser-node-ci.yml'
  pull_request:
    paths:
      - 'apps/browser/**'
      - '.github/workflows/browser-node-ci.yml'

permissions:
  contents: write

jobs:
  verify-browser-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Browser Node network convergence
        if: github.event_name == 'push'
        run: |
          node tools/apply-browser-node-network-convergence.mjs
          cd ../..
          if ! git diff --quiet; then
            git config user.name "Titan Zero CI"
            git config user.email "actions@users.noreply.github.com"
            git add apps/browser/src/browser/agent-runtime apps/browser/src/lib/service-worker.js
            git commit -m "fix(browser): route browser-agent network through governed transport"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Interaction Engine typecheck
        run: npm run interaction:typecheck

      - name: Browser Node verifier
        run: npm test
