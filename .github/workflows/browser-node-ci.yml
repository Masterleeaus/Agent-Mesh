name: Titan Zero Browser Node CI

on:
  push:
    branches:
      - browser-node-convergence-v2
    paths:
      - 'apps/browser/**'
      - '.github/workflows/browser-node-ci.yml'
  pull_request:
    paths:
      - 'apps/browser/**'
      - '.github/workflows/browser-node-ci.yml'

permissions:
  contents: write

jobs:
  verify-browser-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Repair accidental worker bootstrap newline
        if: github.event_name == 'push'
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/browser/src/lib/service-worker.js')
          s = p.read_text()
          bad = r'globalThis.getManagerAISnapshot=getManagerAISnapshot;\nglobalThis.bootstrapAgentMeshResume=bootstrapAgentMeshResume;'
          good = 'globalThis.getManagerAISnapshot=getManagerAISnapshot;\nglobalThis.bootstrapAgentMeshResume=bootstrapAgentMeshResume;'
          if bad not in s:
              raise SystemExit('expected malformed literal \\n worker sequence not found')
          p.write_text(s.replace(bad, good, 1))
          PY
          node --check apps/browser/src/lib/service-worker.js
          git diff --check
          git config user.name "Titan Zero CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/browser/src/lib/service-worker.js
          git commit -m "fix(browser): repair malformed worker bootstrap newline"
          git push origin HEAD:${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Interaction Engine typecheck
        run: npm run interaction:typecheck

      - name: Browser Node verifier
        run: npm test
