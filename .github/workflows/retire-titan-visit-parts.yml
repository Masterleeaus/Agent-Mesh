name: Retire Migrated Titan Visit Parts Routes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-titan-visit-parts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          git rm -f             'titan/apps/web/app/api/v1/visits/[id]/parts/route.ts'             'titan/apps/web/app/api/v1/visits/[id]/parts/[partId]/route.ts'
          find titan/apps -depth -type d -empty -delete || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Retire migrated Titan visit parts routes"
          git push
