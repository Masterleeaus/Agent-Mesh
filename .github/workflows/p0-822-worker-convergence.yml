name: P0 822 Worker Convergence
on:
  push:
    branches:
      - p0/822-worker-typecheck-convergence
permissions:
  contents: write
jobs:
  converge:
    if: github.event.head_commit.message != 'P0 #822: converge worker typecheck and lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/822-worker-typecheck-convergence
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Forward-port worker package convergence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('services/worker/src')
          for p in root.glob('*.ts'):
              text = p.read_text()
              text = text.replace('@ai-fsm/email-templates', '@titan-zero/email-templates')
              text = text.replace('@ai-fsm/domain/promise-capture', '@titan-zero/domain/promise-capture')
              if not p.name.endswith('.test.ts'):
                  text = text.replace('import type { Client } from "pg";', 'import type { DatabaseClient } from "./db-client.js";')
                  text = text.replace('client: Client', 'client: DatabaseClient')
              p.write_text(text)
          for p in root.glob('*.test.ts'):
              text = p.read_text().replace('@ai-fsm/domain/promise-capture', '@titan-zero/domain/promise-capture')
              p.write_text(text)
          PY
          cat > services/worker/src/workflow-events.ts <<'TS'
          import type { DatabaseClient } from "./db-client.js";
          import { logger } from "./logger.js";
          import { cancelNotificationsForEntity } from "./notification/enqueue.js";

          interface WorkflowEvent {
            id: string;
            account_id: string;
            event_type: string;
            entity_type: string;
            entity_id: string;
            payload: Record<string, unknown>;
          }

          const CANCEL_TRIGGERS = new Set([
            "visit.cancelled",
            "estimate.approved",
            "estimate.declined",
            "invoice.paid",
            "invoice.void",
            "membership.cancelled",
          ]);

          export interface WorkflowEventProcessOptions {
            batchSize?: number;
          }

          function retryDelaySeconds(attempt: number): number {
            return Math.min(3600, 5 * 2 ** Math.max(0, attempt - 1));
          }

          export const workflowEventOutboxInternals = { retryDelaySeconds };

          export async function processWorkflowEvents(
            client: DatabaseClient,
            options: WorkflowEventProcessOptions = {},
          ): Promise<number> {
            const batchSize = Math.max(1, Math.min(100, options.batchSize ?? 100));
            const lockClause = client.dialect === "sqlite" || client.dialect === "mysql"
              ? ""
              : "FOR UPDATE SKIP LOCKED";
            const { rows } = await client.query<WorkflowEvent>(
              `SELECT id, account_id, event_type, entity_type, entity_id, payload
               FROM workflow_events
               WHERE processed = false
               ORDER BY created_at ASC
               LIMIT $1
               ${lockClause}`,
              [batchSize],
            );

            if (rows.length === 0) return 0;

            let processed = 0;
            for (const event of rows) {
              try {
                if (CANCEL_TRIGGERS.has(event.event_type)) {
                  const cancelled = await cancelNotificationsForEntity(
                    client,
                    event.entity_type,
                    event.entity_id,
                    event.event_type,
                  );
                  if (cancelled > 0) {
                    logger.info("workflow-events: cancelled pending notifications", {
                      eventType: event.event_type,
                      entityId: event.entity_id,
                      cancelled,
                    });
                  }
                }

                await client.query(
                  `UPDATE workflow_events
                   SET processed = true, processed_at = CURRENT_TIMESTAMP, status = 'completed'
                   WHERE id = $1`,
                  [event.id],
                );
                processed++;
              } catch (err) {
                logger.error("workflow-events: failed to process event", err, { eventId: event.id });
              }
            }

            return processed;
          }
          TS
      - name: Converge lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Worker typecheck
        run: pnpm --filter @titan-zero/worker typecheck
      - name: Worker tests
        run: pnpm --filter @titan-zero/worker test
      - name: Commit verified convergence
        shell: bash
        run: |
          rm -f .github/workflows/p0-822-worker-convergence.yml
          git config user.name "Titan Zero CI"
          git config user.email "actions@users.noreply.github.com"
          git add services/worker pnpm-lock.yaml .github/workflows/p0-822-worker-convergence.yml
          git commit -m "P0 #822: converge worker typecheck and lockfile"
          git push origin HEAD:p0/822-worker-typecheck-convergence
