name: P0 822 Worker Convergence
on:
  push:
    branches:
      - p0/822-worker-typecheck-convergence
permissions:
  contents: write
jobs:
  converge:
    if: ${{ !startsWith(github.event.head_commit.message, 'P0 822 convergence complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0/822-worker-typecheck-convergence
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Forward-port worker package convergence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path('services/worker/src')
          db_file = root / 'db-client.ts'
          for p in root.rglob('*.ts'):
              text = p.read_text()
              text = text.replace('@ai-fsm/email-templates', '@titan-zero/email-templates')
              text = text.replace('@ai-fsm/domain/promise-capture', '@titan-zero/domain/promise-capture')
              if not p.name.endswith('.test.ts') and 'import type { Client } from "pg";' in text:
                  rel = os.path.relpath(db_file, p.parent).replace('\\', '/')
                  rel = rel[:-3] + '.js'
                  if not rel.startswith('.'):
                      rel = './' + rel
                  text = text.replace('import type { Client } from "pg";', f'import type {{ DatabaseClient }} from "{rel}";')
                  text = text.replace('client: Client', 'client: DatabaseClient')
              p.write_text(text)
          PY
          cat > services/worker/src/workflow-events.ts <<'TS'
          import type { DatabaseClient } from "./db-client.js";
          import { logger } from "./logger.js";
          import { cancelNotificationsForEntity } from "./notification/enqueue.js";

          interface WorkflowEvent {
            id: string;
            account_id: string;
            event_type: string;
            entity_type: string;
            entity_id: string;
            payload: Record<string, unknown>;
          }

          const CANCEL_TRIGGERS = new Set([
            "visit.cancelled",
            "estimate.approved",
            "estimate.declined",
            "invoice.paid",
            "invoice.void",
            "membership.cancelled",
          ]);

          export interface WorkflowEventProcessOptions { batchSize?: number; }

          function retryDelaySeconds(attempt: number): number {
            return Math.min(3600, 5 * 2 ** Math.max(0, attempt - 1));
          }

          export const workflowEventOutboxInternals = { retryDelaySeconds };

          export async function processWorkflowEvents(
            client: DatabaseClient,
            options: WorkflowEventProcessOptions = {},
          ): Promise<number> {
            const batchSize = Math.max(1, Math.min(100, options.batchSize ?? 100));
            const lockClause = client.dialect === "sqlite" || client.dialect === "mysql" ? "" : "FOR UPDATE SKIP LOCKED";
            const { rows } = await client.query<WorkflowEvent>(
              `SELECT id, account_id, event_type, entity_type, entity_id, payload
               FROM workflow_events
               WHERE processed = false
               ORDER BY created_at ASC
               LIMIT $1
               ${lockClause}`,
              [batchSize],
            );
            if (rows.length === 0) return 0;
            let processed = 0;
            for (const event of rows) {
              try {
                if (CANCEL_TRIGGERS.has(event.event_type)) {
                  const cancelled = await cancelNotificationsForEntity(client, event.entity_type, event.entity_id, event.event_type);
                  if (cancelled > 0) logger.info("workflow-events: cancelled pending notifications", { eventType: event.event_type, entityId: event.entity_id, cancelled });
                }
                await client.query(
                  `UPDATE workflow_events SET processed = true, processed_at = CURRENT_TIMESTAMP, status = 'completed' WHERE id = $1`,
                  [event.id],
                );
                processed++;
              } catch (err) {
                logger.error("workflow-events: failed to process event", err, { eventId: event.id });
              }
            }
            return processed;
          }
          TS
          cat > services/worker/src/expire-estimates.ts <<'TS'
          import type { DatabaseClient } from "./db-client.js";
          import { databaseDialect } from "./db-client.js";
          import { logger } from "./logger.js";

          export interface ExpireEstimatesResult { expired: number; errors: number; }

          export async function expireEstimates(client: DatabaseClient): Promise<ExpireEstimatesResult> {
            try {
              const dialect = databaseDialect(client);
              const now = dialect === "sqlite" ? "datetime('now')" : dialect === "mysql" ? "current_timestamp" : "now()";
              const candidates = await client.query<{ id: string; account_id: string }>(
                `SELECT id, account_id FROM estimates
                 WHERE status = 'sent' AND expires_at IS NOT NULL AND expires_at < ${now}`,
              );
              if (candidates.rows.length === 0) return { expired: 0, errors: 0 };
              await client.query(
                `UPDATE estimates SET status = 'expired', updated_at = ${now}
                 WHERE status = 'sent' AND expires_at IS NOT NULL AND expires_at < ${now}`,
              );
              logger.info("expire-estimates: marked expired", { count: candidates.rows.length, ids: candidates.rows.map((row) => row.id) });
              return { expired: candidates.rows.length, errors: 0 };
            } catch (error) {
              logger.error("expire-estimates: failed", error);
              return { expired: 0, errors: 1 };
            }
          }
          TS
      - name: Converge lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Worker typecheck
        run: pnpm --filter @titan-zero/worker typecheck
      - name: Worker tests
        id: worker_tests
        continue-on-error: true
        run: pnpm --filter @titan-zero/worker test
      - name: Commit verified convergence
        shell: bash
        run: |
          rm -f .github/workflows/p0-822-worker-convergence.yml
          git config user.name "Titan Zero CI"
          git config user.email "actions@users.noreply.github.com"
          git add services/worker pnpm-lock.yaml .github/workflows/p0-822-worker-convergence.yml
          git commit -m "P0 822 convergence complete: worker typecheck and lockfile"
          git push origin HEAD:p0/822-worker-typecheck-convergence
      - name: Fail on remaining worker test debt
        if: steps.worker_tests.outcome == 'failure'
        run: exit 1
