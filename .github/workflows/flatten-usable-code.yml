name: Flatten usable-code donor roots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flatten codebases into usable-code root
        shell: bash
        run: |
          set -euo pipefail
          ROOT="archive/Titan-Zero-Usable-Code-Donor-Pack/Titan-Zero-Usable-Code-Donor-Pack"
          cd "$ROOT"

          move_tree () {
            src="$1"; dest="$2"
            [ -d "$src" ] || return 0
            if [ -e "$dest" ]; then
              echo "Destination already exists, keeping existing: $dest"
              return 0
            fi
            mv "$src" "$dest"
          }

          # Original extraction
          move_tree "Titan-Zero-Usable-Code-Extraction/Titan-Zero-Usable-Code-Extraction/field-mobile" "fieldcraft-mobile"
          move_tree "Titan-Zero-Usable-Code-Extraction/Titan-Zero-Usable-Code-Extraction/knowledge-rag" "cube-knowledge-rag"
          move_tree "Titan-Zero-Usable-Code-Extraction/Titan-Zero-Usable-Code-Extraction/workflow-builder" "workflowauto"

          # Round 2
          move_tree "Titan-Zero-Usable-Code-Round2/Titan-Zero-Usable-Code-Round2/connectors-n8n/n8n-nodes-vh3ai-main" "n8n-vh3ai"
          move_tree "Titan-Zero-Usable-Code-Round2/Titan-Zero-Usable-Code-Round2/glint-web/glint-main" "glint"
          move_tree "Titan-Zero-Usable-Code-Round2/Titan-Zero-Usable-Code-Round2/marketing-tradepilot/tradepilot-waitlist-main" "tradepilot-marketing"
          move_tree "Titan-Zero-Usable-Code-Round2/Titan-Zero-Usable-Code-Round2/marketing-sites/marketing-sites-extracted/fieldops-marketing-site" "fieldops-marketing"
          move_tree "Titan-Zero-Usable-Code-Round2/Titan-Zero-Usable-Code-Round2/marketing-sites/marketing-sites-extracted/fieldcrew-marketing-site" "fieldcrew-marketing"

          # Round 4: whole source repositories at root, not their internal monorepo packages.
          move_tree "Titan-Zero-Usable-Code-Round4/Titan-Zero-Usable-Code-Round4/ai-fsm-main(3)/ai-fsm-main" "ai-fsm"
          move_tree "Titan-Zero-Usable-Code-Round4/Titan-Zero-Usable-Code-Round4/ResQAI-main(2)/ResQAI-main" "resqai"
          move_tree "Titan-Zero-Usable-Code-Round4/Titan-Zero-Usable-Code-Round4/fieldflow-ai-main(3)/fieldflow-ai-main" "fieldflow-ai"
          move_tree "Titan-Zero-Usable-Code-Round4/Titan-Zero-Usable-Code-Round4/fieldops-ai-main(3)/fieldops-ai-main" "fieldops-ai-round4"
          move_tree "Titan-Zero-Usable-Code-Round4/Titan-Zero-Usable-Code-Round4/fieldcrewai-main(2)/fieldcrewai-main" "fieldcrewai"
          move_tree "Titan-Zero-Usable-Code-Round4/Titan-Zero-Usable-Code-Round4/FieldServicePro-master(3)/FieldServicePro-master" "fieldservicepro"

          # Field Services curated extraction. Keep existing field-services-os if already present.
          if [ ! -d "field-services-os" ]; then
            move_tree "Titan-Zero-Field-Services-OS-Usable-Code/Titan-Zero-Field-Services-OS-Usable-Code/field-services-os" "field-services-os"
          fi

          # Remove empty extraction-wrapper directories only.
          find "Titan-Zero-Usable-Code-Extraction" "Titan-Zero-Usable-Code-Round2" "Titan-Zero-Usable-Code-Round4" "Titan-Zero-Field-Services-OS-Usable-Code"             -depth -type d -empty -delete 2>/dev/null || true

          cat > CODEBASES.md <<'EOF'
          # Usable Code — Root Codebases

          Donor codebases are kept directly under this folder. Internal folders inside a codebase are preserved because they are part of that application's architecture.

          Root codebases include AI-FSM, ResQAI, FieldFlow AI, FieldOps AI, FieldServicePro, Field Services OS, FieldCraft Mobile, Cube Knowledge/RAG, WorkflowAuto, n8n VH3AI, Glint, TradePilot marketing, FieldOps marketing, and FieldCrew marketing.

          Integration rules: normalize tenancy to company_id; preserve Titan Zero canonical surfaces; do not introduce Titan Code as a production dependency; and port donor capabilities into existing Titan architecture rather than creating parallel runtime stacks.
          EOF

      - name: Commit flattened donor layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive/Titan-Zero-Usable-Code-Donor-Pack
          if git diff --cached --quiet; then
            echo "No layout changes"
          else
            git commit -m "archive: flatten usable-code codebases"
            git push
          fi
