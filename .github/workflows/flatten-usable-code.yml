name: Flatten usable-code donor roots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/flatten-usable-code.yml'
      - 'archive/Titan-Zero-Usable-Code-Donor-Pack/**'

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flatten donor codebases into usable-code root
        shell: bash
        run: |
          set -euo pipefail
          ROOT="archive/Titan-Zero-Usable-Code-Donor-Pack/Titan-Zero-Usable-Code-Donor-Pack"
          cd "$ROOT"

          merge_tree () {
            src="$1"; dest="$2"
            [ -d "$src" ] || return 0
            mkdir -p "$dest"
            # Preserve the existing root donor when a path conflicts; bring across
            # only files that are not already represented at the canonical root.
            rsync -a --ignore-existing "$src/" "$dest/"
          }

          # Round 2 nested donors -> canonical root.
          merge_tree "Titan-Zero-Usable-Code-Round2/Titan-Zero-Usable-Code-Round2/field-mobile/FieldCraft-React-Native-application--main" "fieldcraft-mobile"
          merge_tree "Titan-Zero-Usable-Code-Round2/Titan-Zero-Usable-Code-Round2/marketing-sites/marketing-sites-extracted/fieldops-marketing-site" "fieldops-marketing"
          merge_tree "Titan-Zero-Usable-Code-Round2/Titan-Zero-Usable-Code-Round2/marketing-sites/marketing-sites-extracted/fieldcrew-marketing-site" "fieldcrew-marketing"
          merge_tree "Titan-Zero-Usable-Code-Round2/Titan-Zero-Usable-Code-Round2/prior-donor-pack/Titan-Zero-Usable-Code-Donor-Pack/field-services-os" "field-services-os"
          merge_tree "Titan-Zero-Usable-Code-Round2/Titan-Zero-Usable-Code-Round2/prior-donor-pack/Titan-Zero-Usable-Code-Donor-Pack/fieldops-ai" "fieldops-ai"

          # Remove extraction wrapper trees after their contents have been
          # reconciled into the canonical root. Do not remove the canonical roots.
          rm -rf "Titan-Zero-Usable-Code-Extraction" "Titan-Zero-Usable-Code-Round2" "Titan-Zero-Usable-Code-Round4" "Titan-Zero-Field-Services-OS-Usable-Code"

          # No ZIP packages remain inside the usable-code root. Any ZIP donors
          # elsewhere under archive are handled by the archive extraction workflow.
          find . -maxdepth 1 -type f -name '*.zip' -delete

          cat > CODEBASES.md <<'EOF'
          # Usable Code — Canonical Root

          Every donor codebase is directly under this folder. Internal folders inside each donor are preserved as part of that codebase's architecture.

          Canonical donors:
          - ai-fsm
          - cube-knowledge-rag
          - field-services-os
          - fieldcraft-mobile
          - fieldcrew-marketing
          - fieldcrewai
          - fieldflow-ai
          - fieldops-ai
          - fieldops-ai-round4
          - fieldops-marketing
          - fieldservicepro
          - glint
          - n8n-vh3ai
          - resqai
          - tradepilot-marketing
          - workflowauto

          Integration rules:
          - Titan Zero remains the runtime destination; donors are source material, not parallel production apps.
          - Normalize tenancy to canonical company_id.
          - Preserve canonical Zero / Go / Hub surfaces and existing TypeScript architecture.
          - Map donor AgentOps/governance into Workforce, Governance, Assurance and Rewind.
          - Map optimization/decision outputs into Decision Engine / DecisionPacket.
          - Map forecasting/signals into Signal and predictive autonomy.
          - Keep external providers optional and provider-agnostic.
          - Do not introduce Titan Code as a Titan Zero production runtime dependency.
          EOF

      - name: Commit flattened donor layout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive/Titan-Zero-Usable-Code-Donor-Pack
          if git diff --cached --quiet; then
            echo "No layout changes"
          else
            git commit -m "archive: consolidate usable-code donors at canonical root"
            git push
          fi
