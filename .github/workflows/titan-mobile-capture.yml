name: Titan Mobile Capture Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/pubspec.yaml"
      - "apps/mobile/lib/titan/screens/capture_screen.dart"
      - "apps/mobile/lib/titan/generative/demo_engine.dart"
      - "apps/mobile/lib/titan/services/titan_gateway.dart"
      - "apps/mobile/test/visual_evidence_capture_adapter_test.dart"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Compile and test capture adapter
        working-directory: apps/mobile
        run: flutter test test/visual_evidence_capture_adapter_test.dart
