name: Reconcile Titan Portable API Routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-portable-api-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote Titan portable API route implementations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          promoted=0
          for src in sorted(Path("titan/apps/web/app/api").rglob("route.ts")):
              dst=Path(str(src)[len("titan/"):])
              if not dst.is_file(): continue
              try:
                  old=dst.read_text()
                  new=src.read_text()
              except UnicodeDecodeError:
                  continue

              # Titan route must explicitly use the already-migrated portable DB
              # layer; only replace routes still coupled to the old direct DB API.
              portable = "@/lib/db/portable" in new
              old_direct = ('from "@/lib/db"' in old or "getPool(" in old or "queryForSession(" in old)
              if portable and old_direct:
                  dst.write_text(new)
                  subprocess.run(["git","add",str(dst)],check=True)
                  subprocess.run(["git","rm","-f",str(src)],check=True)
                  promoted += 1

          print(f"Promoted {promoted} Titan portable API routes; other conflicts preserved.")
          PY
          find titan/apps -depth -type d -empty -delete || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconcile Titan portable API route implementations"
          git push
