name: Retire Superseded Titan Web Config

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-titan-web-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove archived configs superseded by merged Dovetails config
        shell: bash
        run: |
          set -euo pipefail
          git rm -f titan/apps/web/package.json titan/apps/web/next.config.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Retire superseded archived Titan web configuration"
          git push
