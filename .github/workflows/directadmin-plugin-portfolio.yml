name: DirectAdmin plugin portfolio

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/directadmin/**"
      - "scripts/package-directadmin-portfolio.*"
      - ".github/workflows/directadmin-plugin-portfolio.yml"
  push:
    branches: [main]
    paths:
      - "apps/directadmin/**"
      - "scripts/package-directadmin-portfolio.*"
      - ".github/workflows/directadmin-plugin-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test deterministic portfolio packaging
        run: node --test scripts/package-directadmin-portfolio.test.mjs
      - name: Build all enabled plugin archives and provenance
        run: node scripts/package-directadmin-portfolio.mjs "$RUNNER_TEMP/directadmin-portfolio"
      - name: Validate Server Node package contract
        run: node scripts/validate-directadmin-plugin.mjs apps/directadmin/server-node
      - name: Check lifecycle script syntax
        run: bash -n apps/directadmin/server-node/*.sh apps/directadmin/dev-access/tools/package.sh
