name: Personal Zero Verification

on:
  pull_request:
    paths:
      - "packages/titan-platform/src/personal-zero/**"
      - "packages/titan-platform/tests/personal-zero-*.test.mjs"
      - "packages/titan-platform/package.json"
      - "packages/titan-platform/tsconfig.json"
      - ".github/workflows/personal-zero-verification.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Titan Platform typecheck
        run: pnpm --filter @titan-zero/titan-platform typecheck
      - name: Titan Platform unit tests
        run: pnpm --filter @titan-zero/titan-platform test:unit
