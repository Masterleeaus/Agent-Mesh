name: Canonical Workforce Verification
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - 'services/workforce/**'
      - 'packages/workforce/**'
      - 'packages/storage/**'
      - 'packages/titan-platform/**'
      - 'packages/runtime/**'
      - 'packages/tools/**'
      - 'db/sqlite/**'
      - 'apps/web/app/api/v1/auth/**'
      - 'apps/web/lib/auth/**'
      - 'apps/web/lib/env.ts'
      - 'apps/web/lib/db/dialect.ts'
      - 'apps/web/lib/db/**'
      - 'apps/web/lib/company-storage/**'
      - 'db/migrations/**'
      - 'apps/directadmin/workforce/**'
      - 'apps/directadmin/server-node/**'
      - 'scripts/package-directadmin-plugin.mjs'
      - 'scripts/gate.sh'
      - 'scripts/db-migrate.sh'
      - 'scripts/db-seed.sh'
      - 'scripts/db-provision-runtime.sh'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/workforce-verification.yml'
  workflow_dispatch:
jobs:
  workforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @titan-zero/workforce typecheck
      - run: pnpm --filter @titan-zero/workforce test
      - name: Focused company-native storage typecheck and tests
        run: |
          pnpm --filter @titan-zero/storage typecheck
          pnpm --filter @titan-zero/storage test
      - name: Focused company-storage web consumer test
        run: pnpm --filter @titan-zero/web exec vitest run lib/company-storage/consumer.test.ts
      - name: Canonical cleaning projections and auth/session regressions
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { rm -rf packages/titan-platform/.cleaning-test-dist; }
          trap cleanup EXIT
          node_modules/.bin/tsc \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --strict \
            --skipLibCheck \
            --rootDir packages/titan-platform/src \
            --outDir packages/titan-platform/.cleaning-test-dist \
            packages/titan-platform/src/verticals/cleaning/*.ts
          node --test packages/titan-platform/tests/cleaning-vertical-pass*.test.mjs
          pnpm --filter @titan-zero/web exec vitest run \
            lib/auth/__tests__/current-session.test.ts \
            lib/auth/__tests__/session-context.test.ts \
            lib/auth/__tests__/post-login-destination.unit.test.ts \
            lib/auth/__tests__/middleware.unit.test.ts \
            lib/auth/__tests__/permissions.test.ts \
            lib/auth/__tests__/user-creation-session.test.ts

  auth-http:
    name: Web Login HTTP Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_fsm_test
          POSTGRES_USER: ai_fsm_test
          POSTGRES_PASSWORD: ai_fsm_gate_pw
        ports:
          - "15432:5432"
        options: >-
          --health-cmd "pg_isready -U ai_fsm_test -d ai_fsm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ai_fsm_test:ai_fsm_gate_pw@localhost:15432/ai_fsm_test
      TEST_RUNTIME_DATABASE_URL: postgresql://ai_fsm_web:gate-runtime-only@localhost:15432/ai_fsm_test
      TEST_AUTH_SECRET: gate-test-auth-secret-min-32-chars!!
      TEST_INTERNAL_KEY: gate-internal-test-only
      TEST_WEB_PORT: "3137"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply immutable migrations and provision the restricted runtime
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          RUNTIME_DB_PASSWORD: gate-runtime-only
          TMPDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash scripts/db-migrate.sh
          bash scripts/db-seed.sh
          bash scripts/db-provision-runtime.sh
      - name: Verify the real HTTP login boundary
        shell: bash
        run: |
          set -euo pipefail
          server_log=/tmp/titan-login-http-server.log
          DATABASE_URL="$TEST_DATABASE_URL" \
          TITAN_DEPLOYMENT_PROFILE=compatibility \
          AUTH_SECRET="$TEST_AUTH_SECRET" \
          LOCATION_INTERNAL_KEY="$TEST_INTERNAL_KEY" \
          E2E_SKIP_EMAIL_DELIVERY=1 \
          E2E_DISABLE_LOGIN_RATE_LIMIT=1 \
          NODE_ENV=development \
            pnpm --filter @titan-zero/web exec next dev --port "$TEST_WEB_PORT" >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS "http://localhost:${TEST_WEB_PORT}/api/health" >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat "$server_log"
            exit 1
          fi
          cd apps/web
          TEST_BASE_URL="http://localhost:${TEST_WEB_PORT}" \
          TEST_DATABASE_URL="$TEST_DATABASE_URL" \
          TEST_RUNTIME_DATABASE_URL="$TEST_RUNTIME_DATABASE_URL" \
          LOCATION_INTERNAL_KEY="$TEST_INTERNAL_KEY" \
            pnpm exec vitest run --config vitest.integration.config.ts lib/auth/__tests__/auth.integration.test.ts

  directadmin-workforce:
    name: DirectAdmin Workforce Consumer
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '<!-- titan-subproduct-gate: run -->')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TITAN_COCKPIT_SDK_MODULE: ${{ github.workspace }}/packages/titan-platform/.test-dist/directadmin-sdk.mjs
      TITAN_HOST_SDK_MODULE: ${{ github.workspace }}/packages/titan-platform/.test-dist/directadmin-sdk.mjs
      TITAN_BRIDGE_FIXTURE_MODULE: ${{ github.workspace }}/packages/titan-platform/tests/fixtures/directadmin-bridge-fixture.mjs
      TITAN_WORKFORCE_HOST_ROOT: ${{ github.workspace }}
      TITAN_SERVER_NODE_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile the repository Cockpit SDK
        run: pnpm --filter @titan-zero/titan-platform exec tsc -p tsconfig.test.json --noEmit false --outDir .test-dist --module NodeNext --moduleResolution NodeNext --isolatedModules false
      - name: Bundle the browser Cockpit SDK
        run: |
          node_modules/.pnpm/esbuild@0.27.3/node_modules/esbuild/bin/esbuild \
            packages/titan-platform/src/directadmin-plugin.ts \
            --bundle --format=esm --platform=browser --target=es2022 \
            --outfile=packages/titan-platform/.test-dist/directadmin-sdk.mjs
      - name: Install the locked Chromium browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Export Chromium executable path
        shell: bash
        run: |
          chromium_path="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          test -x "$chromium_path"
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$chromium_path" >> "$GITHUB_ENV"
      - name: Run shared DirectAdmin SDK regressions
        run: |
          pnpm --filter @titan-zero/titan-platform exec node --test \
            tests/directadmin-plugin.test.mjs \
            tests/directadmin-bridge.test.mjs \
            tests/directadmin-workforce-handoff.test.mjs \
            tests/directadmin-browser.browser.mjs
      - name: Run Server Node security and lifecycle regressions
        run: |
          node --test \
            apps/directadmin/server-node/runtime.test.mjs \
            apps/directadmin/server-node/runtime.security.test.mjs \
            apps/directadmin/server-node/directadmin-relay.test.mjs \
            apps/directadmin/server-node/lifecycle.test.mjs
      - name: Run Workforce consumer, browser, package, and contract regressions
        run: |
          node --test \
            apps/directadmin/workforce/tests/*.test.mjs \
            apps/directadmin/workforce/tests/sdk-contract.integration.mjs \
            apps/directadmin/workforce/tests/hosted-sdk.integration.mjs
      - name: Run the merged #1050 RAW relay fixture
        run: |
          pnpm --filter @titan-zero/workforce exec node --import tsx \
            ../../apps/directadmin/workforce/tests/relay-host.integration.mjs
