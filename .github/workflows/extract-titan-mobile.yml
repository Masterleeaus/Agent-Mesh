name: Extract Titan Mobile App

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-titan-mobile.yml'

permissions:
  contents: write

jobs:
  extract-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract mobile application
        shell: bash
        run: |
          set -euo pipefail
          ZIP="apps/mobile/Titan-Mobile-MVP-Pass10.zip"
          test -f "$ZIP"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          shopt -s dotglob nullglob
          items=("$TMP"/*)
          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -a "${items[0]}"/. apps/mobile/
          else
            cp -a "$TMP"/. apps/mobile/
          fi
          rm -f "$ZIP"
          rm -rf "$TMP"
          test ! -f "$ZIP"
          find apps/mobile -maxdepth 3 -type f | sort | head -200

      - name: Commit extracted application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "titan-zero-agent-mesh"
          git config user.email "actions@users.noreply.github.com"
          git add -A apps/mobile
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract Titan Mobile MVP Pass10 source"
          git push origin HEAD:main
