name: Browser Node Manifest Refresh Temp

on:
  push:
    branches:
      - browser-node-manager-prune-guard

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: browser-node-manager-prune-guard
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run source-manifest
      - name: Commit manifest if changed
        run: |
          cd ../..
          if ! git diff --quiet -- apps/browser/source-manifest.json; then
            git config user.name "Titan Zero CI"
            git config user.email "actions@users.noreply.github.com"
            git add apps/browser/source-manifest.json
            git commit -m "chore(browser): refresh source manifest for manager prune guard"
            git push origin HEAD:browser-node-manager-prune-guard
          fi
