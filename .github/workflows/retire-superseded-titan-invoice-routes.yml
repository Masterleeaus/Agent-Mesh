name: Retire Superseded Titan Invoice Routes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-superseded-titan-invoice-routes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          # transition: canonical route adds job_id-aware closeJobIfFullyPaid behavior.
          # line-item route: canonical DELETE is atomic DELETE ... RETURNING.
          git rm -f             'titan/apps/web/app/api/v1/invoices/[id]/transition/route.ts'             'titan/apps/web/app/api/v1/invoices/[id]/line-items/[lineItemId]/route.ts'
          find titan/apps -depth -type d -empty -delete || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Retire superseded Titan invoice routes"
          git push
