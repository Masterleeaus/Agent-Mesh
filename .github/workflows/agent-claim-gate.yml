name: Agent Claim Gate

on:
  # Run policy from the trusted base, never a PR checkout or PR-controlled script.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]
    paths:
      - "roadmap/**"
      - ".github/scripts/validate-agent-claim.py"
      - ".github/scripts/tests/**"
      - ".github/workflows/agent-claim-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: mission-claim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Mission Closure Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate roadmap and claim
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            python3 .github/scripts/validate-agent-claim.py
          else
            python3 .github/scripts/validate-agent-claim.py --self-test
          fi
