name: Agent PR Handoff

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Canonical claim branch, e.g. agent/TZ-ROADMAP-31-SG-01"
        required: true
        type: string
      ready:
        description: "Mark PR ready for Manager review instead of draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-pr-handoff-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLAIM_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
    steps:
      - name: Checkout canonical control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate claim branch shape
        shell: bash
        run: |
          set -euo pipefail
          case "$CLAIM_BRANCH" in
            agent/TZ-G00-SG-*|agent/TZ-ROADMAP-*-SG-*) ;;
            *)
              echo "Invalid Agent Mesh claim branch: $CLAIM_BRANCH"
              exit 1
              ;;
          esac

      - name: Create or preserve canonical agent PR
        id: pr_handoff
        shell: bash
        run: |
          set -euo pipefail
          READY_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.ready }}" = "true" ]; then
            READY_ARG="--ready"
          fi

          set +e
          python3 .github/scripts/open-agent-pr.py \
            --branch "$CLAIM_BRANCH" \
            $READY_ARG \
            --json \
            > pr-handoff.log 2>&1
          STATUS=$?
          set -e
          cat pr-handoff.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            echo "actions_pr_denied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fq "GitHub Actions is not permitted to create or approve pull requests" pr-handoff.log; then
            echo "actions_pr_denied=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Repository Actions policy blocks GITHUB_TOKEN PR creation; recording pending handoff."
            exit 0
          fi

          echo "actions_pr_denied=false" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Record pending PR handoff
        if: steps.pr_handoff.outputs.actions_pr_denied == 'true'
        run: |
          python3 .github/scripts/record-pr-handoff-pending.py \
            --branch "$CLAIM_BRANCH" \
            --reason "Repository Actions policy currently blocks GITHUB_TOKEN from creating pull requests."
