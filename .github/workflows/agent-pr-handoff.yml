name: Agent PR Handoff

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Canonical claim branch, e.g. agent/TZ-ROADMAP-31-SG-01"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-pr-handoff-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve claim branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ inputs.branch }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          case "$BRANCH" in
            agent/TZ-G00-SG-*|agent/TZ-ROADMAP-*-SG-*) ;;
            *)
              echo "Invalid Agent Mesh claim branch: $BRANCH" >&2
              exit 1
              ;;
          esac
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical main tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create or preserve canonical draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/open-agent-pr.py             --branch "${{ steps.branch.outputs.branch }}"             --json
