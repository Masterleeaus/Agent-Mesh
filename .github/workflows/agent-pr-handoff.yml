name: Agent PR Handoff

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claim branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical main
        run: git fetch origin main --depth=1

      - name: Skip empty claim branch
        id: work
        shell: bash
        run: |
          set -euo pipefail
          AHEAD="$(git rev-list --count origin/main..HEAD)"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -eq 0 ]; then
            echo "Claim branch has no commits ahead of main; no PR handoff needed yet."
          fi

      - name: Create canonical draft agent PR
        if: steps.work.outputs.ahead != '0'
        id: pr_handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/open-agent-pr.py \
            --branch "$GITHUB_REF_NAME" \
            --draft \
            --verification "Automatic Agent PR handoff created from committed branch state." \
            --completion "Manager must review current evidence and either merge verified completion or keep only explicit remaining work." \
            --risk "Rollback is available by reverting the merged PR; no automatic merge is performed by this workflow." \
            > pr-handoff.log 2>&1
          STATUS=$?
          set -e
          cat pr-handoff.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            echo "actions_pr_denied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fq "GitHub Actions is not permitted to create or approve pull requests" pr-handoff.log; then
            echo "actions_pr_denied=true" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Actions cannot create PRs for this repository; recording a durable pending handoff instead."
            exit 0
          fi

          echo "actions_pr_denied=false" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Record pending PR handoff
        if: steps.work.outputs.ahead != '0' && steps.pr_handoff.outputs.actions_pr_denied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/record-pr-handoff-pending.py \
            --branch "$GITHUB_REF_NAME" \
            --reason "Repository Actions policy currently blocks GITHUB_TOKEN from creating pull requests."
