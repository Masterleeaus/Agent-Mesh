name: Agent PR Handoff

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claim branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical main
        run: git fetch origin main --depth=1

      - name: Skip empty claim branch
        id: work
        shell: bash
        run: |
          set -euo pipefail
          AHEAD="$(git rev-list --count origin/main..HEAD)"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -eq 0 ]; then
            echo "Claim branch has no commits ahead of main; no PR handoff needed yet."
          fi

      - name: Create or refresh canonical agent PR
        if: steps.work.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/open-agent-pr.py \
            --branch "$GITHUB_REF_NAME" \
            --verification "Automatic Agent PR handoff created from committed branch state." \
            --completion "Manager must review current evidence and either merge verified completion or keep only explicit remaining work." \
            --risk "Rollback is available by reverting the merged PR; no automatic merge is performed by this workflow."
