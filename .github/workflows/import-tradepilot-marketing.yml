name: Import TradePilot marketing source

on:
  push:
    branches: [main]
    paths:
      - "archive/marketing-sites-extracted/marketing-sites-extracted/tradepilot-waitlist-main.zip"
      - ".github/workflows/import-tradepilot-marketing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract TradePilot donor site
        shell: bash
        run: |
          set -euo pipefail
          ZIP="archive/marketing-sites-extracted/marketing-sites-extracted/tradepilot-waitlist-main.zip"
          DEST="apps/web/marketing-source/tradepilot"
          test -f "$ZIP"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          shopt -s dotglob nullglob
          roots=("$TMP"/*)
          if [ "${#roots[@]}" -eq 1 ] && [ -d "${roots[0]}" ]; then
            cp -a "${roots[0]}"/. "$DEST"/
          else
            cp -a "$TMP"/. "$DEST"/
          fi
          rm -rf "$TMP"
          rm -f "$ZIP"
          rm -f ".github/workflows/import-tradepilot-marketing.yml"
      - name: Commit extracted donor source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Titan Zero Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract TradePilot marketing donor into Titan Zero" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
