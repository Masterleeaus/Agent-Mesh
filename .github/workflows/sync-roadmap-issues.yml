name: Sync Roadmap Subgoal Issues

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "roadmap/SUBGOAL-ISSUE-MANIFEST.json"
      - ".github/scripts/sync-roadmap-issues.py"
      - ".github/workflows/sync-roadmap-issues.yml"

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Create every missing roadmap subgoal issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync-roadmap-issues.py
