name: PWA Package

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/pwa/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pwa-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/pwa/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pwa-ci.yml"

permissions:
  contents: read

jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install PWA test dependencies
        run: pnpm install --no-frozen-lockfile --filter @titan-zero/pwa
      - name: Install Chromium
        run: pnpm --filter @titan-zero/pwa exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm --filter @titan-zero/pwa typecheck
      - name: Build
        run: pnpm --filter @titan-zero/pwa build
      - name: Test
        run: pnpm --filter @titan-zero/pwa test
