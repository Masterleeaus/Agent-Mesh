name: Migrate Titan Platform Package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-titan-platform.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move unique Titan platform package into Dovetails workspace
        shell: bash
        run: |
          set -euo pipefail
          test -d titan/packages/titan-platform
          test ! -e packages/titan-platform
          git mv titan/packages/titan-platform packages/titan-platform

          # This package is now part of the Dovetails/Titan Zero workspace.
          # Keep compatibility imports for now; rebranding can be a separate verified pass.
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Migrate Titan platform package into Dovetails workspace"
          git push
