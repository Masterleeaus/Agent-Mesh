name: Retire Migrated Titan Invoice Send Route
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-titan-invoice-send.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          git rm -f 'titan/apps/web/app/api/v1/invoices/[id]/send/route.ts'
          find titan/apps -depth -type d -empty -delete || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Retire migrated Titan invoice send route"
          git push
