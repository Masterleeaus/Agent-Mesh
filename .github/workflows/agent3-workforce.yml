name: Agent 3 Workforce Verification
on:
  push:
    branches: [agent/workforce-task-convergence]
  pull_request:
    paths:
      - 'packages/workforce/**'
      - '.github/workflows/agent3-workforce.yml'
jobs:
  workforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @titan-zero/workforce typecheck
      - run: pnpm --filter @titan-zero/workforce test
