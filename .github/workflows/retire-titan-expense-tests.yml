name: Retire Superseded Titan Expense Tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-titan-expense-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          # Canonical receipt-upload test adds first-photo preservation coverage.
          # Canonical scan test adds transaction_id extraction coverage.
          git rm -f             titan/apps/web/app/api/v1/expenses/__tests__/receipt-upload.unit.test.ts             titan/apps/web/app/api/v1/expenses/__tests__/scan-receipt.unit.test.ts
          find titan/apps -depth -type d -empty -delete || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Retire superseded Titan expense API tests"
          git push
