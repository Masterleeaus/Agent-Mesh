name: Canonical environment defaults

on:
  pull_request:
    paths:
      - '.env.example'
      - 'infra/vps.env.example'
      - 'infra/compose.vps.yml'
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'scripts/vps/**'
      - 'scripts/environment-inventory.mjs'
      - 'scripts/canonical-env-defaults.test.mjs'
      - 'docs/working/issue-1236/environment-inventory.json'
      - 'docs/deployment/README-VPS.md'
      - '.github/workflows/canonical-environment.yml'
  push:
    branches: [main]
    paths:
      - '.env.example'
      - 'infra/vps.env.example'
      - 'infra/compose.vps.yml'
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'scripts/vps/**'
      - 'scripts/environment-inventory.mjs'
      - 'scripts/canonical-env-defaults.test.mjs'
      - 'docs/working/issue-1236/environment-inventory.json'
      - 'docs/deployment/README-VPS.md'
      - '.github/workflows/canonical-environment.yml'

permissions:
  contents: read

jobs:
  canonical-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical defaults and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "No previous commit available; checking full environment inventory."
            node scripts/environment-inventory.mjs --check
          else
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            RANGE="${BASE_SHA}...HEAD"
            CONFIG_CHANGED="$(git diff --name-only "${BASE_SHA} HEAD" -- .env.example infra/vps.env.example infra/compose.vps.yml scripts/vps scripts/environment-inventory.mjs scripts/canonical-env-defaults.test.mjs docs/working/issue-1236/environment-inventory.json docs/deployment/README-VPS.md)"
                        SOURCE_ENV_CHANGED="$(git diff --unified=0 "${BASE_SHA} HEAD" -- apps services packages | grep -E '^[+-][^+-].*(process[.]env|getenv[[:space:]]*[(]|(required|absolutePath|algorithm)[(]environment,|loadPublicKey[(]environment,)' || true)"
            if [ -n "${CONFIG_CHANGED}" ] || [ -n "${SOURCE_ENV_CHANGED}" ]; then
              echo "Environment inputs or statically discoverable bindings changed; checking the generated inventory."
              node scripts/environment-inventory.mjs --check
            else
              echo "No environment binding/configuration changed in this slice; skipping only the whole-tree inventory snapshot check."
            fi
          fi
          node --test scripts/canonical-env-defaults.test.mjs
