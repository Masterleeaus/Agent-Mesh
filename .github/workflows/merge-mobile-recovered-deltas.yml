name: Unzip Titan Mobile Recovered Deltas

on:
  push:
    paths:
      - '.github/workflows/merge-mobile-recovered-deltas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip recovery bundle
        shell: bash
        run: |
          set -euo pipefail
          ZIP="apps/mobile/Titan-Mobile-Recovered-Deltas.zip"
          test -f "$ZIP"
          mkdir -p apps/mobile/recovered-deltas
          unzip -o "$ZIP" -d apps/mobile/recovered-deltas
          rm -f "$ZIP"
          echo "Extracted files:"
          find apps/mobile/recovered-deltas -type f | sort

      - name: Commit extracted deltas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/mobile
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Unzip recovered Titan mobile deltas"
          git push origin HEAD:main
