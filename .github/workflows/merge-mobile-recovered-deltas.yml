name: Merge Titan Mobile Delta ZIPs

on:
  push:
    paths:
      - '.github/workflows/merge-mobile-recovered-deltas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and merge all recovered deltas
        shell: bash
        run: |
          set -euo pipefail
          SRC="apps/mobile/recovered-deltas/mobile_deltas"
          test -d "$SRC"
          mapfile -t ZIPS < <(find "$SRC" -maxdepth 1 -type f -name '*.zip' | sort -V)
          test "${#ZIPS[@]}" -gt 0

          for ZIP in "${ZIPS[@]}"; do
            echo "=== $ZIP ==="
            TMP="$(mktemp -d)"
            unzip -q -o "$ZIP" -d "$TMP"
            echo "Contents:"
            find "$TMP" -type f | sort

            ROOT="$TMP"
            # Strip harmless single wrapper directories.
            while true; do
              mapfile -t ENTRIES < <(find "$ROOT" -mindepth 1 -maxdepth 1 -printf '%p\n')
              if [ "${#ENTRIES[@]}" -eq 1 ] && [ -d "${ENTRIES[0]}" ]; then
                ROOT="${ENTRIES[0]}"
              else
                break
              fi
            done

            # Deltas may contain repo-relative apps/mobile, mobile-relative files,
            # or a delta payload directory. Resolve to the mobile payload.
            if [ -d "$ROOT/apps/mobile" ]; then
              ROOT="$ROOT/apps/mobile"
            elif [ -d "$ROOT/mobile" ] && [ ! -d "$ROOT/lib" ]; then
              ROOT="$ROOT/mobile"
            fi

            rsync -a --exclude='.git' --exclude='*.zip' "$ROOT/" apps/mobile/
            rm -rf "$TMP"
          done

          rm -rf apps/mobile/recovered-deltas
          cat > apps/mobile/RECOVERED_DELTA_MERGE.md <<'EOF'
# Recovered mobile delta merge

Recovered Titan Mobile delta ZIPs were applied in version-sorted order over the
existing Flutter mobile source. The temporary delta ZIP staging directory was
removed after the overlay completed.
EOF

      - name: Commit merged Flutter source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/mobile
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Merge recovered Titan mobile deltas into Flutter source"
          git push origin HEAD:main
