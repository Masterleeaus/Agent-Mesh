name: Distribution Gateway contract

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/titan-platform/src/distribution-gateway.ts"
      - "packages/titan-platform/tests/distribution-gateway.test.mjs"
      - "packages/titan-platform/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/distribution-gateway-contract.yml"
  push:
    branches: [main]
    paths:
      - "packages/titan-platform/src/distribution-gateway.ts"
      - "packages/titan-platform/tests/distribution-gateway.test.mjs"
      - "packages/titan-platform/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/distribution-gateway-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Compile isolated distribution contract
        run: pnpm exec tsc packages/titan-platform/src/distribution-gateway.ts --target ES2022 --module NodeNext --moduleResolution NodeNext --outDir packages/titan-platform/.test-dist --skipLibCheck --strict
      - name: Run focused distribution tests
        run: node --test packages/titan-platform/tests/distribution-gateway.test.mjs
