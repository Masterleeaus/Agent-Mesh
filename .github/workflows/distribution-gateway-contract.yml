name: Distribution Gateway contract

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/titan-platform/src/distribution-gateway.ts"
      - "packages/titan-platform/src/distribution-catalog.ts"
      - "packages/titan-platform/src/distribution-contract-compiler.ts"
      - "packages/titan-platform/tests/distribution-gateway.test.mjs"
      - "packages/titan-platform/tests/distribution-catalog.test.mjs"
      - "packages/titan-platform/tests/distribution-contract-compiler.test.mjs"
      - "packages/titan-platform/tests/distribution-package-conformance.test.mjs"
      - "packages/titan-platform/package.json"
      - "scripts/generate-distribution-coverage.mjs"
      - ".github/workflows/distribution-gateway-contract.yml"
  push:
    branches: [main]
    paths:
      - "packages/titan-platform/src/distribution-gateway.ts"
      - "packages/titan-platform/src/distribution-catalog.ts"
      - "packages/titan-platform/src/distribution-contract-compiler.ts"
      - "packages/titan-platform/tests/distribution-gateway.test.mjs"
      - "packages/titan-platform/tests/distribution-contract-compiler.test.mjs"
      - "packages/titan-platform/tests/distribution-package-conformance.test.mjs"
      - "packages/titan-platform/tests/distribution-catalog.test.mjs"
      - "packages/titan-platform/package.json"
      - "scripts/generate-distribution-coverage.mjs"
      - ".github/workflows/distribution-gateway-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile isolated distribution contract
        run: pnpm exec tsc packages/titan-platform/src/distribution-gateway.ts packages/titan-platform/src/distribution-catalog.ts packages/titan-platform/src/distribution-contract-compiler.ts --target ES2022 --module NodeNext --moduleResolution NodeNext --outDir packages/titan-platform/.test-dist --skipLibCheck --types node --typeRoots packages/storage/node_modules/@types --strict
      - name: Run focused distribution tests
        run: node --test packages/titan-platform/tests/distribution-gateway.test.mjs packages/titan-platform/tests/distribution-catalog.test.mjs packages/titan-platform/tests/distribution-contract-compiler.test.mjs packages/titan-platform/tests/distribution-package-conformance.test.mjs
      - name: Generate commit-bound gap inventory
        run: node scripts/generate-distribution-coverage.mjs > "$RUNNER_TEMP/distribution-coverage.json"
      - name: Publish coverage evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: distribution-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/distribution-coverage.json
          if-no-files-found: error
          retention-days: 14
