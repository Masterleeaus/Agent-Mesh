name: Unpack Merge84

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-merge84.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack canonical Merge84 parts
        shell: bash
        run: |
          set -euo pipefail

          PARTS=(
            "Titan-Zero-MERGE84-Part1-of-3.zip"
            "Titan-Zero-MERGE84-Part2-of-3.zip"
            "Titan-Zero-MERGE84-Part3-of-3.zip"
          )

          for part in "${PARTS[@]}"; do
            test -s "$part"
            unzip -t "$part" >/dev/null
          done

          python3 - <<'PY'
          import zipfile
          parts = [
              "Titan-Zero-MERGE84-Part1-of-3.zip",
              "Titan-Zero-MERGE84-Part2-of-3.zip",
              "Titan-Zero-MERGE84-Part3-of-3.zip",
          ]
          names = []
          for part in parts:
              with zipfile.ZipFile(part) as z:
                  names.extend(i.filename for i in z.infolist() if not i.is_dir())
          if len(names) != 4746:
              raise SystemExit(f"Expected 4746 files, found {len(names)}")
          if len(set(names)) != len(names):
              raise SystemExit("Duplicate paths exist across split ZIPs")
          print("Verified 4746 unique paths across all three ZIPs")
          PY

          for part in "${PARTS[@]}"; do
            unzip -oq "$part" -d .
          done

          python3 - <<'PY'
          import os, zipfile
          parts = [
              "Titan-Zero-MERGE84-Part1-of-3.zip",
              "Titan-Zero-MERGE84-Part2-of-3.zip",
              "Titan-Zero-MERGE84-Part3-of-3.zip",
          ]
          missing = []
          for part in parts:
              with zipfile.ZipFile(part) as z:
                  for i in z.infolist():
                      if not i.is_dir() and not os.path.exists(i.filename):
                          missing.append(i.filename)
          if missing:
              raise SystemExit(f"Missing extracted paths: {missing[:20]}")
          print("All archive paths extracted successfully")
          PY

          rm -f "${PARTS[@]}"
          rm -f .github/workflows/unpack-merge84.yml

      - name: Commit extracted source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Titan Zero Agent Mesh"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unpack canonical Titan Zero Merge84 source"
          git push origin HEAD:main

# one-shot trigger refresh
