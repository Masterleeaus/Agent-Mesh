name: Roadmap work item
description: Create a Titan Zero roadmap subgoal work item
title: "[TZ-ROADMAP-XX-SG-XX] "
labels: ["roadmap"]
body:
  - type: input
    id: subgoal
    attributes:
      label: Subgoal ID
      placeholder: TZ-ROADMAP-01-SG-01
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: textarea
    id: remaining
    attributes:
      label: Remaining work only
      description: Do not recreate completed work. State the remaining implementation gap.
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Architecture acknowledgement
      options:
        - label: company_id is the sole canonical company boundary.
          required: true
        - label: Titan Code remains private development-only.
          required: true
