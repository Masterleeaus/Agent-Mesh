# Include this directive only inside the existing Titan Zero HTTPS :443 vhost.
# Requires Apache 2.4.10+ mod_headers; a config test/reload must fail if absent.
# If the Titan DA session cookie is present, remove the entire Cookie header so
# no duplicate or malformed copy can reach the :443 application.
RequestHeader unset Cookie "expr=%{req:Cookie} =~ m#(^|;[[:blank:]]*)__Host-titan-da-session=#"
