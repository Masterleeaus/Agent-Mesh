services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-titan_zero}
      POSTGRES_USER: ${POSTGRES_USER:-titan_zero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - titan_zero_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-titan_zero} -d ${POSTGRES_DB:-titan_zero}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: titan-zero-web:${APP_TAG:-merge74}
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_DIALECT: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-titan_zero}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-titan_zero}
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    image: titan-zero-worker:${APP_TAG:-merge74}
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_DIALECT: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-titan_zero}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-titan_zero}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  titan_zero_postgres:
