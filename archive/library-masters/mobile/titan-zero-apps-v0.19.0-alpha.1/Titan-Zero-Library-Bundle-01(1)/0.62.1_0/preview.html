<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dassi — Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      padding: 16px 24px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 500;
      color: #a1a1aa;
    }

    .header .filename {
      font-size: 14px;
      font-weight: 600;
      color: #fafafa;
    }

    .header .meta {
      margin-left: auto;
      font-size: 12px;
      color: #71717a;
    }

    .download-btn {
      padding: 6px 14px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .download-btn:hover { background: #2563eb; }

    #loading {
      margin-top: 40vh;
      font-size: 15px;
      color: #71717a;
    }

    #error {
      margin-top: 40vh;
      font-size: 15px;
      color: #ef4444;
      display: none;
    }

    #content {
      flex: 1;
      width: 100%;
      display: none;
      flex-direction: column;
    }

    #content.visible { display: flex; }

    /* Image preview */
    #content img {
      max-width: 100%;
      max-height: calc(100vh - 60px);
      object-fit: contain;
      margin: 24px auto;
    }

    /* PDF / sandboxed HTML frame */
    #content iframe, #content embed {
      flex: 1;
      width: 100%;
      min-height: calc(100vh - 60px);
      border: none;
      background: #fff;
    }

    /* Text preview */
    #content pre {
      flex: 1;
      padding: 24px;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
      background: #09090b;
      color: #d4d4d8;
    }
  </style>
</head>
<body>
  <div id="loading">Loading file...</div>
  <div id="error"></div>
  <div id="content"></div>

  <script type="module" src="preview/main.js"></script>
</body>
</html>
