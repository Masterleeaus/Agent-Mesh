title: "Field Crew AI"
description: "AI-powered marketing, lead automation, and operations for home services contractors. Built for HVAC, plumbing, electrical, and exterior service businesses."
url: "https://fieldcrewai.com"
baseurl: ""
theme: minima

author: "Field Crew AI"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

# All posts served at /blog/slug/
permalink: /blog/:slug/

social:
  name: Field Crew AI
  links:
    - https://fieldcrewai.com

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - wrangler.toml

include:
  - _redirects
  - _headers
