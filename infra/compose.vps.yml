# TRANSITIONAL TITAN RUNTIME COMPOSE — NOT YET THE COMPLETE BUSINESS NODE
# Native Titan/AI-FSM is the default field-service application and must run
# without Frappe. Company-owned operational state targets one physical database
# per company behind the canonical company-storage resolver. The single SQLite
# path below is COMPATIBILITY/RUNTIME composition debt, not the target company
# business-data topology. Optional #1051 Frappe extensions use separate
# per-company sites/databases when enabled. #811/#322/#812 own convergence.
#
# SECURITY DEBT: current web/worker runtime images do not yet set a non-root USER
# and share broad writable mounts. #322/#648/#811 must establish stable service
# UID/GID + role-specific mount/permission contracts before production certification.
#
# IMPORTANT: this compose still omits the persistent services/workforce host.
# Do not certify it as production-complete until that service, company storage
# resolution, migrations, backup/restore and restart acceptance are wired.

name: titan-zero
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - titan_zero_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli INFO persistence | grep -q 'aof_enabled:1'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: titan-zero-web:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: ["${TZ_ENV_FILE:?required}"]
    environment:
      NODE_ENV: production
      APP_PORT: "3000"
      DATABASE_DIALECT: sqlite
      DATABASE_URL: file:/app/data/titan-zero.db
      SQLITE_PATH: /app/data/titan-zero.db
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      redis: {condition: service_healthy}
    volumes:
      - ${TZ_DATA_ROOT:?required}/sqlite:/app/data
      - ${TZ_DATA_ROOT:?required}/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks: [app]

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    image: titan-zero-worker:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: ["${TZ_ENV_FILE:?required}"]
    environment:
      NODE_ENV: production
      DATABASE_DIALECT: sqlite
      DATABASE_URL: file:/app/data/titan-zero.db
      SQLITE_PATH: /app/data/titan-zero.db
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis: {condition: service_healthy}
    volumes:
      - ${TZ_DATA_ROOT:?required}/sqlite:/app/data
      - ${TZ_DATA_ROOT:?required}/uploads:/app/uploads
    networks: [app]

volumes:
  titan_zero_redis:
networks:
  app:
    driver: bridge
